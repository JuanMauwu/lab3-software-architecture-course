apiVersion: apps/v1
kind: Deployment

metadata:
  name: vuelokbt-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vuelokbt

  template:
    metadata:
      labels:
        app: vuelokbt

    spec:
      containers:
        - name: vuelokbt-app
          image: vuelokbt-app:latest
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8089

          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/vuelokbt?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"

            - name: SPRING_DATASOURCE_USERNAME
              value: root

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: MYSQL_ROOT_PASSWORD

---
apiVersion: v1
kind: Service

metadata:
  name: vuelokbt-service
  labels:
    app: vuelokbt

spec:
  selector:
    app: vuelokbt

  ports:
    - name: http
      port: 8089
      targetPort: 8089

  type: LoadBalancer

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: vuelokbt-monitor
  namespace: monitoring

spec:
  selector:
    matchLabels:
      app: vuelokbt

  namespaceSelector:
    matchNames:
      - default

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 10s